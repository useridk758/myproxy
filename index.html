<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="time" id="time">16:05</div>
    <div class="date" id="date">Friday, May 15</div>

    <div class="search-container">
      <input type="text" id="urlInput" placeholder="Search the web..." autofocus>
    </div>

    <div class="apps">
      <div class="app" onclick="quickGo('https://youtube.com')"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YT"><span>YouTube</span></div>
      <div class="app" onclick="quickGo('https://github.com')"><img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GH"><span>GitHub</span></div>
      <div class="app" onclick="quickGo('https://discord.com')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968890.png" alt="DC"><span>Discord</span></div>
      <div class="app" onclick="quickGo('https://x.com')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968958.png" alt="X"><span>Twitter</span></div>
      <div class="app" onclick="quickGo('https://reddit.com')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968898.png" alt="Reddit"><span>Reddit</span></div>
      
      <div class="app" onclick="quickGo('https://spotify.com')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968895.png" alt="Spotify"><span>Spotify</span></div>
      <div class="app" onclick="quickGo('https://netflix.com')"><img src="https://cdn-icons-png.flaticon.com/512/732/732228.png" alt="Netflix"><span>Netflix</span></div>
      <div class="app" onclick="quickGo('https://twitch.tv')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968971.png" alt="Twitch"><span>Twitch</span></div>
      <div class="app" onclick="quickGo('https://gmail.com')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5969054.png" alt="Gmail"><span>Gmail</span></div>
      <div class="app"><img src="https://cdn-icons-png.flaticon.com/512/5968/5969003.png" alt="Add"><span>Add</span></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
